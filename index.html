<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VN Creator AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Gray, emerald and the accent colours below are driven by CSS variables (see theme.css). Defaults equal the
      // stock Tailwind palette (player / RPG / battle look unchanged); the editor shell
      // (.vn-theme) swaps them for the navy + gold palette.
      const scale = (name) => Object.fromEntries(
        [50,100,200,300,400,500,600,700,800,900,950].map(k => [k, `rgb(var(--${name}-${k}) / <alpha-value>)`])
      );
      tailwind.config = {
        theme: { extend: {
          colors: {
            gray: scale('gray'), emerald: scale('emerald'),
            purple: scale('purple'), violet: scale('violet'), fuchsia: scale('fuchsia'), indigo: scale('indigo'),
            sky: scale('sky'), cyan: scale('cyan'), blue: scale('blue'), amber: scale('amber')
          },
          fontFamily: {
            display: ['Cinzel', 'serif'],
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif']
          }
        } }
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #1f2937; }
      ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-900 text-white h-screen overflow-hidden">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
